# English messages for BanHammer
#
# Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Values substituted into {placeholders} are inserted as literal text, so a player
# cannot smuggle MiniMessage tags into staff-facing output through a reason or appeal.

prefix: "<gold>[BanHammer]</gold> "
noPermission: "<red>You don't have permission.</red>"
reloaded: "<green>Configuration reloaded.</green>"
notPlayer: "<red>Only available in-game.</red>"
noTarget: "<yellow>No player in sight!</yellow>"
cannotBan: "<red>You cannot punish this player.</red>"
given: "<green>Ban Hammer given to {player}.</green>"
inventoryFull: "<red>{player}'s inventory is full.</red>"
cooldown: "<yellow>Wait {seconds}s.</yellow>"
bannedBroadcast: "<gold>{staff}</gold> banned <red>{victim}</red>{duration}."
bannedStaff: "<green>{victim}</green> banned{duration}."
tempBannedBroadcast: "<gold>{staff}</gold> banned <red>{victim}</red> for {duration}."
tempBannedStaff: "<green>{victim}</green> banned for {duration}."
kickedStaff: "<green>{victim}</green> kicked."
databaseDisabled: "<red>This feature requires the database (database.enabled: true).</red>"
playerNotFound: "<red>Player not found.</red>"
unbanned: "<green>{player} was unbanned.</green>"
unbanReason: "<gray>Reason: {reason}</gray>"
notBanned: "<yellow>{player} is not banned.</yellow>"

# History
historyHeader: "<gold>--- Ban History of {player} (Page {page}/{maxPages}) ---</gold>"
historyEntry: "<gray>#{id}</gray> <yellow>{type}</yellow> - <white>{reason}</white>"
historyEntryDate: "  <gray>Date: {date}</gray>"
historyEntryStaff: "  <gray>Staff: {staff}</gray>"
historyEntryExpires: "  <gray>Expires: {expires}</gray>"
historyEntryActive: "  <red>[ACTIVE]</red>"
historyEmpty: "<yellow>No entries found.</yellow>"
historyInvalidPage: "<red>Invalid page number.</red>"

# Stats
statsHeader: "<gold>--- Statistics {target} ---</gold>"
statsTotal: "<gray>Total:</gray> <white>{total} punishments</white>"
statsBans: "<gray>Bans:</gray> <white>{bans}</white>"
statsKicks: "<gray>Kicks:</gray> <white>{kicks}</white>"
statsMutes: "<gray>Mutes:</gray> <white>{mutes}</white>"
statsJails: "<gray>Jails:</gray> <white>{jails}</white>"
statsWarnings: "<gray>Warnings:</gray> <white>{warnings}</white>"

# Appeals
appealSubmitted: "<green>Your appeal has been submitted.</green>"
appealCooldown: "<red>You must wait {hours} more hours.</red>"
appealNoActiveBan: "<red>You have no active punishment to appeal against.</red>"
appealTooShort: "<red>The appeal text is too short.</red>"
appealMaxReached: "<red>You have reached the maximum number of appeals for this punishment.</red>"
appealsHeader: "<gold>--- Open Appeals ({count}) ---</gold>"
appealsEntry: "<gray>#{id}</gray> <yellow>{player}</yellow> - {text}"
appealsEntryDate: "  <gray>{date}</gray>"
appealsEmpty: "<yellow>No open appeals.</yellow>"
appealsInvalidId: "<red>Invalid appeal ID.</red>"
appealApproved: "<green>Appeal #{id} was approved.</green>"
appealDenied: "<red>Appeal #{id} was denied.</red>"
appealNotification: "<green>Your appeal was processed: {status}</green>"
appealResponse: "<gray>Response: {response}</gray>"
appealAlreadyProcessed: "<yellow>This appeal has already been processed.</yellow>"
appealsDisabled: "<red>Appeals are disabled on this server.</red>"
appealUsage: "Usage: /appeal <Text>"

# Errors
errorOccurred: "<red>An error occurred. See the server log for details.</red>"
invalidDuration: "<red>Invalid duration. Examples: 30m, 1h30m, 7d, 2w, permanent</red>"

# Mute
muteChatBlocked: "<red>You are muted! Remaining time: {time}</red>"
muteCommandBlocked: "<red>You are muted and cannot use this command! Remaining time: {time}</red>"
mutedMessage: "<red>You have been muted for {duration}.\nReason: {reason}</red>"
notMuted: "<yellow>{player} is not muted.</yellow>"

# Jail
jailed: "<red>You have been jailed!</red>"
unjailed: "<green>You have been released from jail!</green>"
jailEscape: "<red>Don't try to escape!</red>"
jailNoTeleport: "<red>You cannot teleport while in jail!</red>"
jailNoCommands: "<red>You cannot use commands in jail!</red>"
jailFailed: "<red>The player could not be jailed - see the server log.</red>"
notJailed: "<yellow>{player} is not jailed.</yellow>"

# Warnings
warnedMessage: "<yellow>You have been warned!\nReason: {reason}</yellow>"
warnCount: "You now have {count}/{threshold} warnings."

# Command usage
unknownCommand: "<red>Unknown command.</red>"
muteUsage: "Usage: /mute <Player> <Duration> [Reason]"
muteExamples: "Examples: /mute Player 1h, /mute Player permanent Spam"
mutedSuccess: "{victim} was muted for {duration}."
muteCancelled: "The punishment was cancelled by another plugin."
unmuteUsage: "Usage: /unmute <Player> [Reason]"
unmutedSuccess: "{player} was unmuted."
jailNotSet: "Jail location is not set! Use /setjail"
jailUsage: "Usage: /jail <Player> <Duration> [Cell] [Reason]"
jailExamples: "Examples: /jail Player 30m, /jail Player 1h 2 Griefing"
jailedSuccess: "{victim} was jailed for {duration}."
jailCancelled: "The punishment was cancelled by another plugin."
unjailUsage: "Usage: /unjail <Player> [Reason]"
playerNotOnline: "Player is not online."
unjailedSuccess: "{player} was released."
warnUsage: "Usage: /warn <Player> <Reason>"
warnedSuccess: "{victim} was warned."
jailLocationSet: "Jail location set!"
usageBanHammer: "Usage: /banhammer [{commands}]"
giveUsage: "Usage: /banhammer give <Player>"
historyUsage: "Usage: /bh history <Player> [Page]"
unbanUsage: "Usage: /bh unban <Player> [Reason]"
statsUsage: "Usage: /bh stats <Player>"
approveUsage: "Usage: /bh approve <ID> [Response]"
denyUsage: "Usage: /bh deny <ID> [Response]"

# ===== GUI labels =====
# Cosmetic menu text. Buttons are identified internally, so renaming these is safe.
gui:
  title:
    main: "BanHammer Statistics"
    playerStats: "Player statistics"
    leaderboard: "Staff leaderboard"
    serverStats: "Server statistics"
  button:
    playerStats: "<green>Your statistics</green>"
    playerStatsLore: "<gray>Show your punishment history</gray>"
    leaderboard: "<yellow>Staff leaderboard</yellow>"
    leaderboardLore: "<gray>The most active staff members</gray>"
    serverStats: "<aqua>Server statistics</aqua>"
    serverStatsLore: "<gray>Totals across all punishments</gray>"
    back: "<yellow>Back</yellow>"
    close: "<red>Close</red>"
    previousPage: "<yellow>Previous page</yellow>"
    nextPage: "<yellow>Next page</yellow>"
  header:
    total: "<gold><b>Total: {count}</b></gold>"
  footer:
    page: "<gray>Page {page}</gray>"
  entry:
    id: "<gray>ID: {id}</gray>"
    staff: "<gray>By: {staff}</gray>"
    reason: "<white>Reason: {reason}</white>"
    date: "<gray>Date: {date}</gray>"
    active: "<green><b>ACTIVE</b></green>"
    rank: "<yellow>Rank: #{rank}</yellow>"
  stat:
    total: "<gray>Total: {count}</gray>"
    bans: "<red>Bans: {count}</red>"
    kicks: "<yellow>Kicks: {count}</yellow>"
    mutes: "<gold>Mutes: {count}</gold>"
    jails: "<dark_gray>Jails: {count}</dark_gray>"
    warnings: "<light_purple>Warnings: {count}</light_purple>"
  tile:
    total: "<gold><b>Total punishments</b></gold>"
    bans: "<red><b>Bans</b></red>"
    kicks: "<yellow><b>Kicks</b></yellow>"
    mutes: "<gold><b>Mutes</b></gold>"
    jails: "<dark_gray><b>Jails</b></dark_gray>"
    warnings: "<light_purple><b>Warnings</b></light_purple>"

