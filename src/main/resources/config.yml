# =========================================
# BanHammer Configuration
# =========================================
# Every option in this file is read by the plugin.
# Reload with /bh reload unless noted otherwise.

# ===== ITEM SETTINGS =====
item:
  material: CARROT_ON_A_STICK
  name: "<gold>Ban Hammer</gold>"
  lore:
    - "<gray>The legendary hammer of admins</gray>"
    - "<gray>Use it wisely.</gray>"
  customModelData: 812345
  unbreakable: true
  hideFlags: true
  # Give the hammer to staff (banhammer.use) when they join, if they don't have one yet
  giveOnJoin: false

# ===== BAN SETTINGS =====
ban:
  # Announce bans to everyone on the server.
  # Reason and duration come from the ban presets further down.
  broadcast: true

# ===== LANGUAGE =====
# Bundled languages: de, en. Loads messages_<language>.yml.
language: "en"

# ===== COOLDOWN =====
# Seconds a staff member must wait between two hammer uses
cooldownSeconds: 3
# Cooldown for cycling presets (milliseconds)
presetSwitchCooldown: 250

# ===== EFFECTS =====
effects:
  lightning: true
  sound: true
  particles: true
  knockback:
    enabled: false
    horizontal: 0.8
    vertical: 0.35

# ===== DOWNLOAD LINKS =====
# Shown as clickable [Label] entries, e.g. "Download here: [Modrinth] [CurseForge]".
# Add or remove providers freely; an entry with an empty URL is hidden.
downloadLinks:
  Modrinth: "https://modrinth.com/plugin/bs-banhammer"
  CurseForge: ""

# ===== RESOURCE PACK =====
# The BanHammer resource pack is a separate download.
resourcePackHint:
  # Show a clickable download hint to staff (banhammer.use) on join.
  # Set to false to turn the hint off entirely.
  enabled: true
  # Same format as downloadLinks above
  links:
    Modrinth: "https://modrinth.com/resourcepack/bs-banhammer-resource-pack"
    CurseForge: ""

# ===== DATABASE =====
# Required for history, statistics, mutes, jails, warnings and appeals.
database:
  enabled: false

  # SQLITE, MYSQL or MARIADB
  type: SQLITE

  sqlite:
    file: "banhammer.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "banhammer"
    username: "root"
    password: ""
    # Require an encrypted connection. Leave false for a database on localhost.
    useSsl: false

  # Seconds to wait for the database to come up before giving up
  initializationTimeoutSeconds: 60

  # Shown in Discord messages and stored with every record (useful across a network)
  serverName: "Server"

# ===== TEMPORARY PUNISHMENTS =====
# Automatically lifts punishments once they expire. Requires the database.
tempBans:
  enabled: true
  # How often to check for expired punishments (seconds, minimum 5)
  checkInterval: 60
  # Tell the player their punishment expired, if they are online
  notifyOnExpire: true

# ===== IP BANNING =====
ipBan:
  # Allow the hammer to issue IP bans at all
  enabled: false
  # Make EVERY hammer ban an IP ban, regardless of the selected preset
  autoIpBan: false
  # Store the (anonymized, see privacy below) address with the punishment record
  trackIps: true

# ===== DISCORD INTEGRATION =====
discord:
  enabled: false
  webhookUrl: ""

  # Which events to post
  notifications:
    bans: true
    kicks: true
    unbans: true
    mutes: true
    jails: true
    warnings: true
    appeals: true

  # Include these details in the embeds
  showStaffName: true
  showServerName: true

# ===== REASON VALIDATION =====
validation:
  maxReasonLength: 500
  # Refuse a punishment that has no reason
  requireReason: false
  # Mask blocked words in reasons
  filterReasons: false
  blockedWords: []

# ===== LOGGING =====
logging:
  # Also append punishments to a separate file in the plugin folder
  separateFile: false
  fileName: "banhammer-punishments.log"

  # Which punishment types to record
  logBans: true
  logKicks: true
  logUnbans: true
  logMutes: true
  logJails: true
  logWarnings: true

# ===== APPEALS =====
# Players can contest any ACTIVE punishment (mute, jail, warning, ban) with /appeal.
appeals:
  enabled: true
  # Minimum text length; must not exceed validation.maxReasonLength
  minLength: 20
  # Hours a player must wait between two appeals
  cooldown: 24
  # How often the same punishment may be appealed
  maxAppealsPerPunishment: 3
  # Tell online staff (banhammer.appeals) about new appeals
  notifyStaff: true

# ===== PUNISHMENT TYPES =====
punishmentTypes:
  # Mute System
  mute:
    enabled: true
    defaultReason: "Spam/Insult"
    preventChat: true
    preventCommands: true
    # Muted players cannot write on signs or in books either
    preventSigns: true
    preventBooks: true
    blockedCommands:
      - "msg"
      - "tell"
      - "w"
      - "r"
      - "me"
      - "say"

  # Jail System
  jail:
    enabled: true
    # Hook into EssentialsX jails when it is installed.
    # true  = jails are managed in Essentials (the built-in jail is unused)
    # false = always use BanHammer's built-in jail
    # Takes effect on plugin (re)start.
    useEssentials: true
    # Essentials cell used when /jail is called without one
    essentialsDefaultJail: "1"
    defaultReason: "Rule violation"
    preventMovement: true
    preventTeleport: true
    preventDamage: true
    # When true, only /appeal, /help and private messages remain available
    preventCommands: false
    # How far a jailed player may stray from the jail before being pulled back (blocks)
    maxDistance: 10.0
    # Set with /setjail
    location:
      world: "world"
      x: 0.0
      y: 64.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0

  # Warning System
  warnings:
    enabled: true
    # Auto-ban once a player reaches this many warnings.
    # The counted warnings are consumed by the ban, so the next warning starts over.
    autoBanThreshold: 3
    autoBanDuration: "7d"
    # Warnings older than this stop counting towards the threshold (0 = never expire)
    expireAfterDays: 90

# ===== BAN PRESETS =====
# Cycle with Shift + right-click, apply with right-click on a player.
# duration: a value like 30m / 1h30m / 7d / 2w / 3mo / 1y, or "permanent".
# An unreadable duration makes the preset be skipped with an error in the log -
# it is never silently treated as permanent.
presets:
  temp_1h:
    displayName: "1 Hour Ban"
    reason: "Temporary ban - 1 hour"
    duration: "1h"
    ipBan: false
    sound: "BLOCK_NOTE_BLOCK_PLING"

  temp_1d:
    displayName: "1 Day Ban"
    reason: "Temporary ban - 1 day"
    duration: "1d"
    ipBan: false
    sound: "BLOCK_NOTE_BLOCK_PLING"

  temp_7d:
    displayName: "7 Days Ban"
    reason: "Temporary ban - 7 days"
    duration: "7d"
    ipBan: false
    sound: "BLOCK_NOTE_BLOCK_PLING"

  permanent:
    displayName: "Permanent Ban"
    reason: "Permanently banned"
    duration: "permanent"
    ipBan: false
    sound: "BLOCK_NOTE_BLOCK_BASS"

  permanent_ip:
    displayName: "Permanent IP-Ban"
    reason: "Permanently IP-banned"
    duration: "permanent"
    ipBan: true
    sound: "BLOCK_ANVIL_LAND"

# ===== KICK/JAIL PRESETS =====
# Cycle with Shift + left-click, apply with left-click on a player.
# No 'duration' key at all = kick. A 'duration' key = jail
# ("permanent" therefore means a permanent jail, not a kick).
kickJailPresets:
  quick_kick:
    displayName: "Quick Kick"
    reason: "Kicked from server"
    sound: "BLOCK_NOTE_BLOCK_PLING"

  warning_kick:
    displayName: "Warning Kick"
    reason: "Warning - kicked from server"
    sound: "BLOCK_NOTE_BLOCK_PLING"

  jail_10m:
    displayName: "10 Min Jail"
    reason: "Jailed for 10 minutes"
    duration: "10m"
    sound: "BLOCK_NOTE_BLOCK_BASS"

  jail_30m:
    displayName: "30 Min Jail"
    reason: "Jailed for 30 minutes"
    duration: "30m"
    sound: "BLOCK_NOTE_BLOCK_BASS"

  jail_1h:
    displayName: "1 Hour Jail"
    reason: "Jailed for 1 hour"
    duration: "1h"
    sound: "BLOCK_ANVIL_LAND"

# ===== PRIVACY =====
privacy:
  # How IP addresses are stored:
  #   NONE    - full address (needs a lawful basis under the GDPR)
  #   PARTIAL - drop the last octet, e.g. 192.168.1.0 (irreversible)
  #   HASH    - keyed digest; lets you correlate repeat offenders WITHOUT storing the
  #             address. This is pseudonymisation, not anonymisation: anyone who knows
  #             the salt below can recover the address, so treat the salt as a secret.
  #   FULL    - masked entirely (irreversible)
  # Note: with anything other than NONE an IP ban cannot be lifted automatically,
  # because the stored value is no longer the real address. Use /pardon-ip then.
  ipAnonymization: "PARTIAL"

  # Generated automatically on first start. Do NOT change it afterwards -
  # every IP hash stored so far would stop matching.
  ipHashSalt: "change-me-to-random-salt"

  # Automatic deletion of old punishment history
  dataRetention:
    enabled: false
    deleteAfterDays: 365
    # Never delete punishments that are still active
    keepActivePunishments: true

# ===== UPDATE CHECKER =====
updateChecker:
  enabled: true
  checkOnStartup: true
  # Notify players with banhammer.updatenotify on join
  notifyAdmins: true
  # Hours between checks (0 = only on startup). Takes effect on restart.
  checkInterval: 6
  modrinthProjectId: "bs-banhammer"
